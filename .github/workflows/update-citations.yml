name: Update publication citations

on:
  schedule:
    # Monday at 10:17 Asia/Shanghai (02:17 UTC).
    - cron: '17 2 * * 1'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/update_citations.py
      - scripts/test_update_citations.py
      - .github/workflows/update-citations.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: publication-citation-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test citation parsers and failure preservation
        run: python -m unittest discover -s scripts -p 'test_update_citations.py'
      - name: Refresh source snapshots
        run: python scripts/update_citations.py
      - name: Commit refreshed citations
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- _data/publications.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add _data/publications.json
          git commit -m 'Refresh publication citation snapshots'
          git push origin HEAD:master
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      # A GITHUB_TOKEN push does not trigger the normal Pages build.
      - name: Request a Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds"
